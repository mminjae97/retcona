[project]
name = "retcona-backend"
version = "0.1.0"
description = "Retcona backend — a novel plausibility/consistency verification app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "redis>=5.0",           # local dev QueueClient implementation (10.4.3)
    "rank-bm25>=0.2",       # BM25 hybrid search (chapter 5)
    "sentence-transformers>=5.2",  # KURE-v1 embedding, bge-reranker (chapter 5); 5.2 is the first to allow transformers 5
    "transformers>=5.17,<6",  # NLI model (7.2); same major version as ml/nli, which saves it
    "kiwipiepy>=0.24,<0.25",  # Korean part-of-speech tags for the extraction rules (Apache-2.0, model included)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
# Adding a top-level package? Also add it to infra/app_logging.py's APP_PACKAGES.
include = ["api*", "pipeline*", "models*", "ai*", "workers*", "infra*"]
