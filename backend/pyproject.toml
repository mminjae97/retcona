[project]
name = "retcona-backend"
version = "0.1.0"
description = "Retcona backend — a novel plausibility/consistency verification app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "starlette>=1.10",  # TrustedHostMiddleware reading an IPv6 Host ("[::1]:8000"), which api/main.py allows
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "rank-bm25>=0.2",       # BM25 hybrid search (chapter 5)
    # The models run with ONNX Runtime (infra/inference_client.py), on the GPU
    # through DirectML on Windows (the app's platform), on the CPU elsewhere.
    # The two packages are one module, onnxruntime: only one may be installed.
    "onnxruntime-directml>=1.24; sys_platform == 'win32'",
    "onnxruntime>=1.24; sys_platform != 'win32'",
    "numpy",
    "transformers>=5.17,<6",  # the exported models' tokenizers; same major version as ml/, which saves them
    "kiwipiepy>=0.24,<0.25",  # Korean part-of-speech tags for the extraction rules (Apache-2.0, model included)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
# Adding a top-level package? Also add it to infra/app_logging.py's APP_PACKAGES.
include = ["api*", "pipeline*", "models*", "ai*", "workers*", "infra*"]
