[project]
name = "retcona-backend"
version = "0.1.0"
description = "Retcona backend — 소설 개연성 검증 서비스"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "authlib>=1.3",        # OAuth 2.0 소셜 로그인 (3.1)
    "python-jose[cryptography]>=3.3",  # JWT/JWE (3.3)
    "passlib[bcrypt]>=1.7",
    "redis>=5.0",           # 로컬 개발용 QueueClient 구현체 (10.4.3)
    "rank-bm25>=0.2",       # BM25 하이브리드 검색 (5장)
    "sentence-transformers>=3.0",  # KURE-v1 임베딩, bge-reranker (5장)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "auth*", "pipeline*", "models*", "ai*", "workers*", "infra*"]
