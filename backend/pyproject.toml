[project]
name = "retcona-backend"
version = "0.1.0"
description = "Retcona backend — a novel plausibility/consistency verification service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "authlib>=1.3",        # OAuth 2.0 social login (3.1)
    "python-jose[cryptography]>=3.3",  # JWT/JWE (3.3)
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<4.1",  # passlib 1.7.4's backend detection breaks on bcrypt>=4.1 (unpatched upstream)
    "email-validator>=2.0",  # pydantic EmailStr
    "redis>=5.0",           # local dev QueueClient implementation (10.4.3)
    "rank-bm25>=0.2",       # BM25 hybrid search (chapter 5)
    "sentence-transformers>=3.0",  # KURE-v1 embedding, bge-reranker (chapter 5)
    "transformers>=5.17,<6",  # NLI model (7.2); same major version as ml/nli, which saves it
    "tzdata>=2024.1",       # IANA time zones for the purge schedule on platforms without a system copy
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
# Adding a top-level package? Also add it to infra/app_logging.py's APP_PACKAGES.
include = ["api*", "auth*", "pipeline*", "models*", "ai*", "workers*", "infra*"]
